<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Přihlášení se nepovedlo</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .box {
        max-width: 360px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      p {
        margin: 0 0 18px;
        color: GrayText;
      }

      button {
        font: inherit;
        padding: 9px 16px;
        border: 1px solid GrayText;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Přihlášení se nepovedlo</h1>
      <!-- Filled in by script, never interpolated into the markup: the text can come
           from a provider or from an error message. -->
      <p id="message"></p>
      <button id="close" type="button">Zavřít okno</button>
    </div>
    <script>
      var error = %s;
      document.getElementById("message").textContent = error.message || "Zkuste to prosím znovu.";
      document.getElementById("close").addEventListener("click", function () {
        window.close();
      });
      window.addEventListener("load", function () {
        // Tell the app the popup is coming back empty-handed, so it can stop waiting.
        // The window stays open with the message -- closing it would hide the reason.
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "authError", message: error.message, code: error.code }, window.location.origin);
          }
        } catch (e) {
          // A closed or cross-origin opener is not worth reporting here.
        }
      });
    </script>
  </body>
</html>
